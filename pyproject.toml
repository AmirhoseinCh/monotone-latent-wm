[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lmwm"
version = "0.1.0"
description = "Latent World Models with Monotone Planning Costs for Image-Goal Navigation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }

[project.urls]
Paper = "https://arxiv.org/abs/2608.09073"
Repository = "https://github.com/AmirhoseinCh/monotone-latent-wm"

[tool.setuptools.packages.find]
include = ["lmwm*"]
